# Render Blueprint (Phase 6) — one-command deploy of the API, the static
# frontend, and a managed Postgres. In the Render dashboard:
#   New > Blueprint > pick this repo. Fill the `sync: false` secrets afterwards.
#
# Railway alternative: deploy backend/ via the Dockerfile and the frontend as a
# static site; provision Postgres and set the same env vars by hand.

databases:
  - name: backtestlab-db
    plan: free

services:
  # ---- API (FastAPI, Docker) ----
  - type: web
    name: backtestlab-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backtestlab-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: AUTH_DEV_MODE
        value: "false" # never accept dev tokens in prod
      # Set to the deployed frontend origin (e.g. https://backtestlab-web.onrender.com)
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Supabase (Phase 3) and Lemon Squeezy (Phase 5) secrets:
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_VARIANT_PRO
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false

  # ---- Frontend (Vite static build) ----
  - type: web
    name: backtestlab-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the deployed API origin (e.g. https://backtestlab-api.onrender.com)
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback so client-side paths resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
